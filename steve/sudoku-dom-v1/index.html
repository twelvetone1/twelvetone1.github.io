<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <!-- The same viewport as the live app's index.html, so the home-screen icon behaves alike. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku DOM Spike</title>
    <!--
        Issue #42, step 1: the go/no-go spike. The board and controls are ordinary HTML laid out by
        CSS, so rotation, resizing and the on-screen keyboard are the browser's job, not Compose's.
        It plays an in-memory game only and never writes the real app's saved game.
    -->
    <style>
        :root {
            --bg: #121212; --fg: #e6e6e6; --dim: #9a9a9a; --line: #3a3a3a; --thick: #b0b0b0;
            --given-bg: #262626; --user: #8ab4f8; --accent: #bb86fc; --hl: #3a3150; --mark: #ff9800;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
        body {
            font: 16px -apple-system, system-ui, sans-serif;
            -webkit-text-size-adjust: 100%;
            /* No callout, text selection or double-tap zoom: they fight long-press and fast taps. */
            touch-action: manipulation;
            -webkit-user-select: none; user-select: none;
            -webkit-touch-callout: none;
            overflow: hidden;
        }
        #app {
            display: flex; gap: 16px; padding: 8px;
            height: 100vh; height: 100dvh;
        }
        #boardWrap { position: relative; flex: none; aspect-ratio: 1; container-type: size; }
        @media (orientation: landscape) {
            #app { flex-direction: row; }
            /* As tall as the screen, but never so wide that the controls get less than 320px. */
            #boardWrap {
                width: min(100vh - 16px, 100vw - 16px - 16px - 320px);
                width: min(100dvh - 16px, 100vw - 16px - 16px - 320px);
            }
        }
        @media (orientation: portrait) {
            #app { flex-direction: column; }
            #boardWrap {
                width: min(100vw - 16px, 100vh - 16px - 16px - 300px);
                width: min(100vw - 16px, 100dvh - 16px - 16px - 300px);
            }
        }
        #board {
            display: grid; grid-template: repeat(9, 1fr) / repeat(9, 1fr);
            width: 100%; height: 100%; border: 2px solid var(--thick);
        }
        .cell {
            border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
            display: flex; align-items: center; justify-content: center;
            font-size: 6.5cqw; cursor: pointer; position: relative;
        }
        .cell.c2, .cell.c5 { border-right: 2px solid var(--thick); }
        .cell.r2, .cell.r5 { border-bottom: 2px solid var(--thick); }
        /* The board's own border closes the last column and row. */
        .cell.c8 { border-right: none; }
        .cell.r8 { border-bottom: none; }
        .cell.given { background: var(--given-bg); font-weight: 600; }
        .cell.user { color: var(--user); }
        .cell.hl { background: var(--hl); }
        .cell.marked { box-shadow: inset 0 0 0 3px var(--mark); }
        .pm {
            display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr);
            width: 100%; height: 100%; font-size: 2.6cqw; color: var(--dim);
        }
        .pm span { display: flex; align-items: center; justify-content: center; }
        .pm span.hl { color: var(--bg); background: var(--accent); border-radius: 50%; }
        #overlay { position: absolute; inset: 0; pointer-events: none; }
        #controls {
            flex: 1; min-width: 0; min-height: 0; overflow: auto;
            display: flex; flex-direction: column; gap: 12px;
        }
        #banner { font-size: 13px; color: var(--dim); }
        #banner b { color: var(--fg); }
        #pad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-width: 420px; }
        #pad button { aspect-ratio: 1; font-size: 22px; }
        #actions { display: flex; gap: 8px; flex-wrap: wrap; max-width: 420px; }
        #actions button { flex: 1; }
        button {
            font: inherit; color: var(--fg); background: #2a2a2a;
            border: 1px solid #555; border-radius: 10px; padding: 10px 12px; cursor: pointer;
        }
        button.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
        #help { font-size: 13px; color: var(--dim); max-width: 420px; }
        #readout { font: 11px ui-monospace, monospace; color: #ffd54f; white-space: pre-wrap; }
        dialog {
            background: #1e1e1e; color: var(--fg); border: 1px solid #555; border-radius: 12px;
            padding: 16px; width: min(360px, 90vw);
        }
        dialog::backdrop { background: rgba(0, 0, 0, 0.6); }
        dialog input {
            width: 100%; font-size: 17px; padding: 10px; margin: 8px 0 12px;
            background: #121212; color: var(--fg); border: 1px solid #555; border-radius: 8px;
            -webkit-user-select: text; user-select: text;
        }
    </style>
</head>
<body>
<div id="app">
    <div id="boardWrap">
        <div id="board"></div>
        <svg id="overlay" viewBox="0 0 9 9" preserveAspectRatio="none"></svg>
    </div>
    <div id="controls">
        <div id="banner"></div>
        <div id="pad"></div>
        <div id="actions">
            <button id="pencil">Pencil</button>
            <button id="newgame">New game</button>
            <button id="opendialog">Type test</button>
        </div>
        <div id="help">
            Pick a digit, then tap cells. Long-press one cell, then long-press another: a line joins
            them. "Type test" opens a text box to bring up the keyboard.
        </div>
        <div id="readout"></div>
    </div>
</div>
<dialog id="dialog">
    <form method="dialog">
        <div>Type anything, then OK.</div>
        <input id="dialogInput" type="text" autocomplete="off">
        <button value="ok">OK</button>
    </form>
</dialog>
<!-- The live app's Firebase bridge, so the spike runs with production's scripts loaded. Read-only
     here: only the sign-in state is asked for. -->
<script type="module" src="../sudoku/firebase-bridge.js"></script>
<script src="webdom.js" defer></script>
</body>
</html>
