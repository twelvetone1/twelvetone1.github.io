<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku measure v1</title>
    <script>
        // Measurement build: a live readout of every size Compose could take its canvas size from.
        (function () {
            var resizes = 0, log = [];
            window.addEventListener("resize", function () { resizes++; log.push("resize@" + Math.round(performance.now()) + " " + innerWidth + "x" + innerHeight); });
            function findCanvas() {
                var found = null;
                (function f(r) { r.querySelectorAll("*").forEach(function (e) { if (!found && e.tagName === "CANVAS") found = e; if (e.shadowRoot) f(e.shadowRoot); }); })(document);
                return found;
            }
            function r(el) { if (!el) return "none"; var b = el.getBoundingClientRect(); return Math.round(b.width) + "x" + Math.round(b.height) + " client " + el.clientWidth + "x" + el.clientHeight; }
            document.addEventListener("DOMContentLoaded", function () {
                var box = document.createElement("div");
                box.style.cssText = "position:fixed;right:6px;top:6px;z-index:2147483647;background:rgba(0,0,0,.85);color:#ff0;font:12px/1.3 Menlo,monospace;padding:6px;white-space:pre;pointer-events:none";
                document.documentElement.appendChild(box);
                var t0 = performance.now();
                setInterval(function () {
                    var c = findCanvas();
                    var vv = window.visualViewport;
                    box.textContent = "measure v1  t=" + ((performance.now() - t0) / 1000).toFixed(0) + "s" +
                        "\nwindow inner " + innerWidth + "x" + innerHeight + "  outer " + outerWidth + "x" + outerHeight +
                        "\nscreen " + screen.width + "x" + screen.height + "  avail " + screen.availWidth + "x" + screen.availHeight +
                        "\nvisualViewport " + (vv ? Math.round(vv.width) + "x" + Math.round(vv.height) : "none") +
                        "\nhtml " + r(document.documentElement) + "\nbody " + r(document.body) +
                        "\nbody>div " + r(document.body.querySelector("div")) +
                        "\ncanvas css " + r(c) + "  backing " + (c ? c.width + "x" + c.height : "-") +
                        "\ndpr " + devicePixelRatio + "  orientation " + (screen.orientation ? screen.orientation.type : "?") +
                        "  standalone " + (matchMedia("(display-mode: standalone)").matches) +
                        "\nresize events " + resizes + (log.length ? "\n" + log.slice(-4).join("\n") : "");
                }, 1000);
            });
        })();
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body { background: #121212; }
        canvas { display: block; }
    </style>
    <script>
        // iPadOS 27.2 (Safari and Chrome alike) leaves Compose's canvas solid white when the page is
        // served from twelvetone1.github.io: the app runs and issues its draw calls, but nothing it
        // draws reaches the screen. Passing requestAnimationFrame through a page-defined function
        // makes the frames appear. Found by bisection on 2026-10-28 -- a minimal Compose page was
        // white without this and drew with it, every time; why it works is not understood, so keep
        // it until an iPad on a later iPadOS draws the app without it.
        (function () {
            var raf = window.requestAnimationFrame;
            window.requestAnimationFrame = function (callback) {
                return raf.call(window, function (time) { callback(time); });
            };
        })();
    </script>
</head>
<body>
    <script type="module" src="firebase-bridge.js"></script>
    <script src="stevesudoku.js" defer></script>
</body>
</html>
