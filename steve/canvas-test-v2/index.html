<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canvas test v2</title>
<style>
  body { background: #121212; color: #ddd; font: 16px -apple-system, sans-serif; margin: 12px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .cell { border: 1px solid #555; padding: 6px; }
  canvas { width: 100%; height: 130px; display: block; }
  .res, pre { font: 12px Menlo, monospace; margin-top: 4px; white-space: pre-wrap; }
</style>
</head>
<body>
<h3>Canvas test v2: each box should show a COLOURED TRIANGLE on a grey background</h3>
<div class="grid" id="grid"></div>
<pre id="info"></pre>
<script>
// Unlike v1, these draw with shaders, which is what everything after Compose's first clear needs.
var VS1 = "attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }";
var FS1 = "precision mediump float; uniform vec4 c; void main(){ gl_FragColor = c; }";
var VS3 = "#version 300 es\nin vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }";
var FS3 = "#version 300 es\nprecision highp float; uniform vec4 c; out vec4 o; void main(){ o = c; }";
var composeAttrs = { alpha: true, depth: true, stencil: true, antialias: false, premultipliedAlpha: true,
                     preserveDrawingBuffer: false, powerPreference: "default", failIfMajorPerformanceCaveat: false };
var tests = [
  { name: "WebGL1 triangle", want: "GREEN", rgb: [0, 0.7, 0], kind: "webgl", attrs: {}, vs: VS1, fs: FS1 },
  { name: "WebGL2 triangle (GLSL 3)", want: "BLUE", rgb: [0.2, 0.3, 1], kind: "webgl2", attrs: {}, vs: VS3, fs: FS3 },
  { name: "WebGL2 GLSL 1 shader", want: "ORANGE", rgb: [1, 0.55, 0], kind: "webgl2", attrs: {}, vs: VS1, fs: FS1 },
  { name: "WebGL2, Compose's settings", want: "PURPLE", rgb: [0.6, 0.2, 0.9], kind: "webgl2", attrs: composeAttrs, vs: VS3, fs: FS3 }
];
function compile(gl, type, src) {
  var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error("shader: " + gl.getShaderInfoLog(s));
  return s;
}
var grid = document.getElementById("grid");
tests.forEach(function (t) {
  var cell = document.createElement("div"); cell.className = "cell";
  cell.innerHTML = "<b>" + t.want + " triangle</b> — " + t.name;
  var c = document.createElement("canvas"), res = document.createElement("div"); res.className = "res";
  cell.appendChild(c); cell.appendChild(res); grid.appendChild(cell);
  var gl, prog, buf;
  function draw() {
    gl.viewport(0, 0, c.width, c.height);
    gl.clearColor(0.3, 0.3, 0.3, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT | gl.STENCIL_BUFFER_BIT);
    gl.useProgram(prog);
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    var loc = gl.getAttribLocation(prog, "p");
    gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    gl.uniform4f(gl.getUniformLocation(prog, "c"), t.rgb[0], t.rgb[1], t.rgb[2], 1);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  try {
    c.width = c.clientWidth * devicePixelRatio; c.height = c.clientHeight * devicePixelRatio;
    gl = c.getContext(t.kind, t.attrs);
    if (!gl) { res.textContent = "NO CONTEXT"; return; }
    prog = gl.createProgram();
    gl.attachShader(prog, compile(gl, gl.VERTEX_SHADER, t.vs));
    gl.attachShader(prog, compile(gl, gl.FRAGMENT_SHADER, t.fs));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error("link: " + gl.getProgramInfoLog(prog));
    buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-0.8, -0.8, 0.8, -0.8, 0, 0.8]), gl.STATIC_DRAW);
    draw();
    var px = new Uint8Array(4);
    gl.readPixels(Math.floor(c.width / 2), Math.floor(c.height * 0.4), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    res.textContent = "triangle centre reads " + Array.prototype.join.call(px, ",") + ", gl error " + gl.getError() + ", lost=" + gl.isContextLost();
    var n = 0;
    (function frame() { if (++n < 120) { draw(); requestAnimationFrame(frame); } })();
  } catch (e) { res.textContent = "FAILED: " + e.message; }
});

// What the page is told about the GPU. Skia picks its drawing workarounds from these strings.
var lines = [location.href, navigator.userAgent, "secure=" + window.isSecureContext + " dpr=" + devicePixelRatio];
["webgl2", "webgl"].forEach(function (k) {
  var gl = document.createElement("canvas").getContext(k);
  if (!gl) { lines.push(k + ": no context"); return; }
  var dbg = gl.getExtension("WEBGL_debug_renderer_info");
  lines.push(k + ": VENDOR=" + gl.getParameter(gl.VENDOR) + " | RENDERER=" + gl.getParameter(gl.RENDERER) +
    " | VERSION=" + gl.getParameter(gl.VERSION));
  lines.push("  debug_renderer_info: " + (dbg ? "yes, " + gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) + " / " + gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : "NOT AVAILABLE"));
  var hp = gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER, gl.HIGH_FLOAT);
  lines.push("  frag highp precision=" + hp.precision + ", maxTex=" + gl.getParameter(gl.MAX_TEXTURE_SIZE) +
    ", extensions=" + (gl.getSupportedExtensions() || []).length);
});
document.getElementById("info").textContent = lines.join("\n");
</script>
</body>
</html>
